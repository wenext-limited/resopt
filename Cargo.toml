[package]
name = "resopt-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Plan, verify, and apply resource optimizations for Apple projects."
license = "MIT"
readme = "README.md"
repository = "https://github.com/wenext-limited/resopt"
documentation = "https://docs.rs/resopt-cli"
keywords = ["xcode", "xcassets", "png", "optimization", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[lib]
name = "resopt"
path = "src/lib.rs"

[[bin]]
name = "resopt"
path = "src/main.rs"

[dependencies]
ignore = "0.4.33"
regex = "1"
maud = "0.27"
tiny_http = "0.12"
getrandom = "0.4"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
oxipng = { version = "=10.2.1", default-features = false, features = ["parallel"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
walkdir = "2"
xcassets = "0.2"
rayon = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-image-io = "0.3.2"

[dev-dependencies]
crc32fast = "1"
